<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Mac Second Monitor</title>
  <desc id="desc">A Mac and a tablet connected by a USB cable; the tablet extends the Mac's desktop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16244A"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#6A4CFF"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A4CFF"/>
      <stop offset="1" stop-color="#FF7A59"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7FA6FF"/>
      <stop offset="1" stop-color="#FFB199"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="28" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#FFFFFF">
    <path d="M0 130H1280M0 260H1280M0 390H1280M320 0V520M640 0V520M960 0V520"/>
  </g>

  <text x="640" y="70" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700">Mac Second Monitor</text>
  <text x="640" y="106" text-anchor="middle" fill="#AFC3FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">Turn a tablet, phone or computer into a real extra display for your Mac</text>

  <!-- MacBook -->
  <g filter="url(#shadow)">
    <rect x="150" y="150" width="470" height="300" rx="18" fill="#1C2333" stroke="#3A4560" stroke-width="2"/>
    <rect x="166" y="166" width="438" height="268" rx="8" fill="url(#wall)"/>
    <rect x="166" y="166" width="438" height="16" rx="4" fill="#0B1220" opacity="0.55"/>
    <circle cx="178" cy="174" r="3" fill="#FFFFFF" opacity="0.8"/>
    <rect x="196" y="171" width="34" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
    <rect x="238" y="171" width="24" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
    <rect x="200" y="206" width="250" height="160" rx="10" fill="#FFFFFF" opacity="0.92"/>
    <rect x="200" y="206" width="250" height="22" rx="10" fill="#E9EEF8"/>
    <circle cx="214" cy="217" r="4" fill="#FF5F57"/>
    <circle cx="228" cy="217" r="4" fill="#FEBC2E"/>
    <circle cx="242" cy="217" r="4" fill="#28C840"/>
    <rect x="216" y="244" width="150" height="8" rx="4" fill="#C9D3E8"/>
    <rect x="216" y="262" width="210" height="8" rx="4" fill="#DCE3F1"/>
    <rect x="216" y="280" width="180" height="8" rx="4" fill="#DCE3F1"/>
    <rect x="216" y="298" width="120" height="8" rx="4" fill="#DCE3F1"/>
    <!-- window continues onto the tablet -->
    <rect x="480" y="236" width="124" height="120" rx="10" fill="#FFFFFF" opacity="0.85"/>
    <rect x="480" y="236" width="124" height="22" rx="10" fill="#E9EEF8"/>
    <path d="M120 450h530l-26 22H146z" fill="#2A3346" stroke="#3A4560" stroke-width="2"/>
    <rect x="345" y="452" width="80" height="6" rx="3" fill="#3A4560"/>
  </g>

  <!-- Tablet -->
  <g filter="url(#shadow)">
    <rect x="760" y="190" width="380" height="250" rx="26" fill="#1C2333" stroke="#3A4560" stroke-width="2"/>
    <rect x="780" y="210" width="340" height="210" rx="12" fill="url(#wall2)"/>
    <rect x="780" y="210" width="340" height="14" rx="5" fill="#0B1220" opacity="0.45"/>
    <rect x="780" y="226" width="96" height="120" rx="10" fill="#FFFFFF" opacity="0.85"/>
    <rect x="780" y="226" width="96" height="22" rx="10" fill="#E9EEF8"/>
    <rect x="796" y="262" width="60" height="8" rx="4" fill="#DCE3F1"/>
    <rect x="796" y="280" width="48" height="8" rx="4" fill="#DCE3F1"/>
    <rect x="900" y="250" width="196" height="146" rx="10" fill="#FFFFFF" opacity="0.92"/>
    <rect x="900" y="250" width="196" height="22" rx="10" fill="#E9EEF8"/>
    <circle cx="914" cy="261" r="4" fill="#FF5F57"/>
    <circle cx="928" cy="261" r="4" fill="#FEBC2E"/>
    <circle cx="942" cy="261" r="4" fill="#28C840"/>
    <path d="M916 370l26-40 22 26 18-18 30 32z" fill="#7FA6FF"/>
    <circle cx="1060" cy="300" r="12" fill="#FFB199"/>
    <!-- touch -->
    <circle cx="1010" cy="330" r="16" fill="#FFFFFF" opacity="0.35"/>
    <circle cx="1010" cy="330" r="7" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Cable -->
  <path d="M624 430 C 690 500, 700 470, 760 430 S 830 460, 950 440" fill="none" stroke="url(#cable)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="704" cy="474" r="5" fill="#FFFFFF" filter="url(#glow)"/>
  <rect x="640" y="478" width="200" height="30" rx="15" fill="#0B1220" stroke="#3A4560"/>
  <text x="740" y="498" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">USB · ~30 ms · 60–120 fps</text>

  <!-- Wi-Fi -->
  <g transform="translate(1176 214)" fill="none" stroke="#AFC3FF" stroke-width="5" stroke-linecap="round">
    <path d="M-26 0a37 37 0 0 1 52 0" opacity="0.5"/>
    <path d="M-16 11a22 22 0 0 1 32 0" opacity="0.75"/>
    <circle cx="0" cy="22" r="3" fill="#AFC3FF" stroke="none"/>
  </g>
  <text x="1176" y="262" text-anchor="middle" fill="#AFC3FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">or Wi-Fi</text>
</svg>
