<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">Arrange the new display</title>
  <desc id="d">In System Settings, Displays, Arrange: drag the tablet next to the Mac's screen so the pointer moves across naturally.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .h { fill: #FFFFFF; font-size: 18px; font-weight: 700; }
    .l { fill: #FFFFFF; font-size: 14px; font-weight: 600; }
    .m { fill: #AFC3FF; font-size: 13px; }
  </style>
  <rect width="900" height="300" rx="24" fill="#0F1A33"/>
  <text class="h" x="40" y="46">System Settings → Displays → Arrange…</text>

  <!-- Mac display -->
  <rect x="150" y="90" width="300" height="190" rx="10" fill="#2F6BFF" opacity="0.9"/>
  <rect x="150" y="90" width="300" height="16" rx="6" fill="#FFFFFF" opacity="0.85"/>
  <text class="l" x="300" y="200" text-anchor="middle">Built-in Display</text>

  <!-- Tablet display, being dragged -->
  <rect x="470" y="120" width="210" height="132" rx="10" fill="#6A4CFF" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="7 6"/>
  <text class="l" x="575" y="184" text-anchor="middle">Your tablet</text>
  <text class="m" x="575" y="206" text-anchor="middle">2560 × 1600</text>

  <!-- Drag hint -->
  <path d="M760 186h-60" stroke="#FFB199" stroke-width="4" stroke-linecap="round"/>
  <path d="M712 174l-14 12 14 12" fill="none" stroke="#FFB199" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="m" x="770" y="180">drag next to</text>
  <text class="m" x="770" y="198">your screen</text>
</svg>
