name: Release

# Push a tag like v0.1.0 to build and publish all apps.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          # Without these secrets the APK is signed with a throwaway debug key.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MSM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MSM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MSM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export MSM_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MacSecondMonitor-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/MacSecondMonitor-*.apk

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist

  mac:
    needs: [android, web]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/release
      - name: Build app and DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}" BUILD="${GITHUB_RUN_NUMBER}" SIGN_IDENTITY="-" DMG=1 mac/scripts/build-app.sh
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            mac/build/MacSecondMonitor-*.dmg
            android/app/build/outputs/apk/release/MacSecondMonitor-*.apk
