name: Release

# Builds the DMG and APK for an existing tag and attaches them to a draft release.
# Run it from Actions → Release → Run workflow (releases can also be built locally with
# mac/scripts/build-app.sh; see CHANGELOG.md for the release checklist).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        env:
          # Without these secrets the APK is signed with a throwaway debug key.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MSM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MSM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MSM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            export MSM_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/MacSecondMonitor-${TAG#v}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/MacSecondMonitor-*.apk

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: web/dist

  mac:
    needs: [android, web]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web/dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/release
      - name: Build app and DMG
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}" BUILD="${GITHUB_RUN_NUMBER}" SIGN_IDENTITY="-" DMG=1 mac/scripts/build-app.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          files: |
            mac/build/MacSecondMonitor-*.dmg
            android/app/build/outputs/apk/release/MacSecondMonitor-*.apk
